name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64,          label: linux-amd64 }
          - { goos: linux,  goarch: arm64,          label: linux-arm64 }
          - { goos: linux,  goarch: arm, goarm: '7', label: linux-armv7 }
          - { goos: linux,  goarch: '386',          label: linux-x86 }
          - { goos: darwin, goarch: amd64,          label: darwin-amd64 }
          - { goos: darwin, goarch: arm64,          label: darwin-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath -ldflags="-s -w" -o snailrace ./cmd/snailrace
      - name: Package
        run: |
          archive="snailrace-${GITHUB_REF_NAME}-${{ matrix.label }}.tar.gz"
          tar -czf "$archive" snailrace README.md
          sha256sum "$archive" > "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
