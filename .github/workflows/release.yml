name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  release:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64, cgo: '0', runner: ubuntu-latest, label: linux-amd64 }
          - { goos: linux,  goarch: arm64, cgo: '0', runner: ubuntu-latest, label: linux-arm64 }
          - { goos: linux,  goarch: arm, goarm: '7', cgo: '0', runner: ubuntu-latest, label: linux-armv7 }
          - { goos: linux,  goarch: '386', cgo: '0', runner: ubuntu-latest, label: linux-x86 }
          - { goos: darwin, goarch: amd64, cgo: '1', runner: macos-26-intel, label: darwin-amd64 }
          - { goos: darwin, goarch: arm64, cgo: '1', runner: macos-latest, label: darwin-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test Darwin
        if: matrix.goos == 'darwin'
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target || '12.0' }}
        run: go build -trimpath -ldflags="-s -w" -o snailrace ./cmd/snailrace
      - name: Package
        run: |
          archive="snailrace-${GITHUB_REF_NAME}-${{ matrix.label }}.tar.gz"
          tar -czf "$archive" snailrace README.md completions
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
