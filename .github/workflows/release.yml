name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...

  validate-release:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64, cgo: '0', runner: ubuntu-latest }
          - { goos: linux,  goarch: arm64, cgo: '0', runner: ubuntu-latest }
          - { goos: linux,  goarch: arm, goarm: '7', cgo: '0', runner: ubuntu-latest }
          - { goos: linux,  goarch: '386', cgo: '0', runner: ubuntu-latest }
          - { goos: darwin, goarch: amd64, cgo: '1', runner: macos-26-intel }
          - { goos: darwin, goarch: arm64, cgo: '1', runner: macos-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test native platform
        if: matrix.goos == 'darwin' || matrix.goarch == 'amd64'
        run: go test ./...
      - name: Validate release build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: go build -trimpath -o /tmp/snailrace ./cmd/snailrace

  create-release:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  release:
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64, cgo: '0', runner: ubuntu-latest, label: linux-amd64 }
          - { goos: linux,  goarch: arm64, cgo: '0', runner: ubuntu-latest, label: linux-arm64 }
          - { goos: linux,  goarch: arm, goarm: '7', cgo: '0', runner: ubuntu-latest, label: linux-armv7 }
          - { goos: linux,  goarch: '386', cgo: '0', runner: ubuntu-latest, label: linux-x86 }
          - { goos: darwin, goarch: amd64, cgo: '1', runner: macos-26-intel, label: darwin-amd64 }
          - { goos: darwin, goarch: arm64, cgo: '1', runner: macos-latest, label: darwin-arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test Darwin
        if: matrix.goos == 'darwin'
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          go build -trimpath \
            -ldflags="-s -w -X github.com/shellcell/snailrace/internal/app.Version=${GITHUB_REF_NAME}" \
            -o snailrace ./cmd/snailrace
      - name: Package
        run: |
          name="snailrace-${GITHUB_REF_NAME}-${{ matrix.label }}"
          mkdir -p "$name/man/man1" "$name/completions"
          cp snailrace LICENSE README.md "$name/"
          cp docs/snailrace.1 "$name/man/man1/"
          cp completions/snailrace.bash completions/_snailrace completions/snailrace.fish "$name/completions/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Build distro packages (.deb/.rpm/.apk)
        if: matrix.goos == 'linux' && (matrix.goarch == 'amd64' || matrix.goarch == 'arm64')
        env:
          # nfpm's go directive is newer than go.mod's toolchain; let go
          # download what nfpm needs instead of failing on GOTOOLCHAIN=local.
          GOTOOLCHAIN: auto
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          sudo apt-get update && sudo apt-get install -y gettext-base
          export PKG_VERSION="${GITHUB_REF_NAME#v}" PKG_ARCH="${{ matrix.goarch }}" PKG_BIN=./snailrace
          envsubst < nfpm.yaml > /tmp/nfpm.yaml
          mkdir -p pkgs
          for fmt in deb rpm apk; do
            nfpm package -f /tmp/nfpm.yaml -p "$fmt" -t pkgs
          done
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          if compgen -G 'pkgs/*' > /dev/null; then
            gh release upload "$GITHUB_REF_NAME" pkgs/* --clobber
          fi

  bump-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Homebrew formula bump
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          gh api repos/shellcell/homebrew-tap/dispatches \
            -f event_type=bump-formula \
            -f 'client_payload[formula]=snailrace' \
            -f "client_payload[version]=${GITHUB_REF_NAME#v}"

  publish-packages:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger package repo publish
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          gh api repos/shellcell/packages/dispatches \
            -f event_type=publish-packages \
            -f "client_payload[project]=${GITHUB_REPOSITORY#*/}" \
            -f "client_payload[version]=${GITHUB_REF_NAME#v}"

  aur-bump:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AUR bumps (source + -bin)
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          name="${GITHUB_REPOSITORY#*/}"
          ver="${GITHUB_REF_NAME#v}"
          for pkg in "$name" "$name-bin"; do
            gh api repos/shellcell/aur/dispatches \
              -f event_type=aur-bump \
              -f "client_payload[package]=$pkg" \
              -f "client_payload[version]=$ver"
          done
